<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Gauntlet — 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1521;
  --brand:#1B2A41;
  --brand-2:#26374F;
  --paper:#EEF1F5;
  --card:#FFFFFF;
  --line:#DFE4EA;
  --muted:#69737F;
  --gold:#C8A24A;
  --win:#1B7F4B;
  --loss:#B3261E;
  --rail:264px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.01em}
.mono{font-family:"Roboto Mono",ui-monospace,monospace}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:var(--rail);flex:0 0 var(--rail);
  background:var(--brand);color:#fff;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
  border-right:1px solid rgba(255,255,255,.08);
}
.brand{padding:22px 22px 18px;border-bottom:1px solid rgba(255,255,255,.10)}
.brand .mark{
  font-family:"Barlow Condensed",sans-serif;
  font-size:30px;font-weight:700;line-height:.95;
  text-transform:uppercase;letter-spacing:.02em;
}
.brand .mark span{color:var(--gold)}
.brand .sub{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.55);margin-top:7px;font-weight:600;
}
.nav{padding:12px 0;flex:1;overflow-y:auto}
.nav button{
  width:100%;text-align:left;background:none;border:0;color:rgba(255,255,255,.72);
  font:inherit;font-weight:500;padding:11px 22px;cursor:pointer;
  display:flex;align-items:center;gap:11px;border-left:3px solid transparent;
}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(255,255,255,.10);color:#fff;border-left-color:var(--gold);font-weight:600}
.nav .ico{width:17px;height:17px;flex:0 0 17px;opacity:.9}
.railfoot{padding:14px 22px 20px;font-size:11px;color:rgba(255,255,255,.42);border-top:1px solid rgba(255,255,255,.10);line-height:1.5}

.main{flex:1;min-width:0}
.topbar{display:none}
.wrap{max-width:1040px;margin:0 auto;padding:26px 26px 72px}

.phead{margin:0 0 18px}
.phead h1{
  font-size:34px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.01em;
}
.phead p{margin:5px 0 0;color:var(--muted);font-size:13.5px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card + .card{margin-top:16px}
.card-h{
  padding:13px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:#FAFBFC;
}
.card-h h2{font-size:17px;margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.card-h .hint{font-size:12px;color:var(--muted);font-weight:500}

/* ---------- standings ---------- */
table{width:100%;border-collapse:collapse}
th{
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
  font-weight:700;text-align:left;padding:9px 16px;border-bottom:1px solid var(--line);
  background:#FAFBFC;
}
td{padding:12px 16px;border-bottom:1px solid #EFF2F5;vertical-align:middle}
tr:last-child td{border-bottom:0}
.rank{
  font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;
  width:34px;color:var(--muted);text-align:center
}
tr.lead .rank{color:var(--gold)}
.who{font-weight:600;font-size:15.5px}
.pts{
  font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;
  text-align:right;width:70px
}
.bar{height:5px;background:#EAEEF2;border-radius:3px;overflow:hidden;margin-top:6px;max-width:230px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
tr.lead .bar i{background:var(--gold)}

/* ---------- team chips ---------- */
.chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 11px;border-radius:6px;font-weight:600;font-size:13.5px;
  line-height:1.2;border:1px solid rgba(0,0,0,.10);
}
.chip .rec{font-size:11px;opacity:.82;font-weight:500;font-family:"Roboto Mono",monospace}

/* ---------- roster wall ---------- */
.squads{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.squad .card-h{background:var(--brand);color:#fff;border-bottom:0}
.squad .card-h h2{font-size:18px}
.squad .card-h .tot{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;color:var(--gold)}
.tiles{display:flex;flex-direction:column}
.tile{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 13px;border-bottom:1px solid rgba(0,0,0,.07);
  font-weight:600;font-size:14px;
}
.tile:last-child{border-bottom:0}
.tile .rec{font-family:"Roboto Mono",monospace;font-size:11.5px;opacity:.85;font-weight:500}
.tile .cf{font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.75;font-weight:700}

/* ---------- weeks ---------- */
.weekbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.weekbar button{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:7px;
  padding:8px 13px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)
}
.weekbar button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ownerblock{margin-bottom:14px}
.ownerblock .oh{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:11px 16px;background:var(--brand);color:#fff;border-radius:9px 9px 0 0;
}
.ownerblock .oh .nm{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;text-transform:uppercase}
.ownerblock .oh .wk{font-size:13px;font-weight:600}
.ownerblock .oh .wk b{color:var(--gold);font-size:17px;font-family:"Barlow Condensed",sans-serif}
.games{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 9px 9px}
.g{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid #EFF2F5;font-size:14px}
.g:last-child{border-bottom:0}
.g .res{
  width:20px;flex:0 0 20px;text-align:center;font-weight:700;font-size:13px;
  font-family:"Roboto Mono",monospace
}
.g .res.w{color:var(--win)}
.g .res.l{color:var(--loss)}
.g .res.p{color:#B9C0C8}
.g .mt{flex:1;min-width:0}
.g .mt .vs{color:var(--muted);font-size:12.5px}
.g .sc{font-family:"Roboto Mono",monospace;font-size:13px;color:var(--muted);white-space:nowrap}
.g .pt{
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;
  width:30px;text-align:right
}
.badge{
  display:inline-block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:700;padding:2px 6px;border-radius:4px;background:#FDF3DC;color:#8A6A16;
  border:1px solid #EFDCA9;margin-left:6px;vertical-align:1px
}

/* ---------- money ---------- */
.moneygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.mstat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.mstat .k{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mstat .v{font-family:"Barlow Condensed",sans-serif;font-size:32px;font-weight:700;line-height:1.05;margin-top:3px}
.mstat .v.gold{color:var(--gold)}
.chart{padding:16px}
.chartwrap{position:relative;height:210px}
svg{display:block;width:100%;height:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 16px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.legend i{width:11px;height:3px;border-radius:2px;display:inline-block}

/* ---------- waivers ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:#FAFBFC}
.filters button{
  border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;
  font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)
}
.filters button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px;padding:14px 16px}
.prio{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #EFF2F5}
.prow:last-child{border-bottom:0}
.prow .n{
  width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px
}
.prow.first .n{background:var(--gold)}
.prow .nm{font-weight:600;flex:1}
.prow .pp{font-size:12.5px;color:var(--muted);font-family:"Roboto Mono",monospace}

/* ---------- moves ---------- */
.move{display:flex;gap:13px;padding:14px 16px;border-bottom:1px solid #EFF2F5}
.move:last-child{border-bottom:0}
.move .d{
  font-family:"Roboto Mono",monospace;font-size:11.5px;color:var(--muted);
  width:74px;flex:0 0 74px;padding-top:3px
}
.move .b{flex:1}
.move .kind{
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  padding:2px 7px;border-radius:4px;display:inline-block;margin-bottom:5px
}
.kind.trade{background:#E7F0FB;color:#1B4E8A;border:1px solid #C6DCF3}
.kind.waiver{background:#EAF6EE;color:#1B6B41;border:1px solid #C5E5D2}
.kind.fa{background:#F3EEFA;color:#5B3C8A;border:1px solid #DCCDF0}

/* ---------- empty ---------- */
.empty{padding:34px 22px;text-align:center;color:var(--muted)}
.empty .big{
  font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:600;
  color:var(--ink);margin-bottom:5px
}
.empty p{margin:0;font-size:13.5px;max-width:400px;margin-inline:auto}

/* ---------- mobile ---------- */
@media (max-width:860px){
  .shell{display:block}
  .rail{
    position:fixed;left:0;top:0;bottom:0;z-index:60;width:252px;flex-basis:252px;
    transform:translateX(-100%);transition:transform .22s ease;height:100dvh
  }
  body.menu .rail{transform:none}
  .scrim{
    position:fixed;inset:0;background:rgba(10,16,26,.5);z-index:55;opacity:0;
    pointer-events:none;transition:opacity .22s
  }
  body.menu .scrim{opacity:1;pointer-events:auto}
  .topbar{
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;
    background:var(--brand);color:#fff;padding:11px 14px;
    padding-top:calc(11px + env(safe-area-inset-top));
  }
  .topbar .burger{
    background:none;border:0;padding:5px;cursor:pointer;display:grid;gap:4px;
  }
  .topbar .burger i{display:block;width:20px;height:2px;background:#fff;border-radius:2px}
  .topbar .t{
    font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;
    text-transform:uppercase;letter-spacing:.02em
  }
  .topbar .t span{color:var(--gold)}
  .wrap{padding:18px 14px 64px}
  .phead h1{font-size:27px}
  .squads{grid-template-columns:1fr}
  td,th{padding-left:12px;padding-right:12px}
  .pts{font-size:23px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:4px}
</style>
</head>

<div class="scrim" onclick="document.body.classList.remove('menu')"></div>

<div class="topbar">
  <button class="burger" aria-label="Menu" onclick="document.body.classList.toggle('menu')">
    <i></i><i></i><i></i>
  </button>
  <div class="t">The <span>Gauntlet</span></div>
</div>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="mark">The<br><span>Gauntlet</span></div>
      <div class="sub">2026 Season</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="railfoot" id="foot"></div>
  </aside>

  <main class="main">
    <div class="wrap" id="view"></div>
  </main>
</div>

<script>
/* ============ helpers ============ */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col = t => D.colors[t] || ["1B2A41","FFFFFF"];
const money = n => '$' + n.toLocaleString();

/* ownership as of a date (points don't travel) */
function ownerAt(team, date){
  for(const s of D.stints){
    if(s.team!==team) continue;
    if(s.start && date < s.start) continue;
    if(s.end && date > s.end) continue;
    return s.owner;
  }
  return null;
}
function currentRoster(o){
  return D.stints.filter(s=>s.owner===o && !s.end).map(s=>s.team).sort();
}
const rostered = new Set(D.stints.filter(s=>!s.end).map(s=>s.team));

/* played games only */
const played = D.games.filter(g=>g.homePts!=null && g.awayPts!=null);
const hasResults = played.length>0;
const weeks = [...new Set(D.games.map(g=>g.week))].sort((a,b)=>a-b);

function winnerOf(g){
  if(g.homePts==null||g.awayPts==null) return null;
  if(g.homePts>g.awayPts) return g.home;
  if(g.awayPts>g.homePts) return g.away;
  return null;
}
/* is this a head-to-head (different owners on game day)? */
function h2h(g){
  const a=ownerAt(g.home,g.date), b=ownerAt(g.away,g.date);
  return (a&&b&&a!==b) ? [a,b] : null;
}

/* points: 1 per regular-season win, credited to game-day owner */
function pointsByOwner(){
  const p={}; D.owners.forEach(o=>p[o]=0);
  for(const g of played){
    const w=winnerOf(g); if(!w) continue;
    const o=ownerAt(w,g.date);
    if(o) p[o]+=1;
  }
  return p;
}
function weeklyPoints(o,wk){
  let n=0;
  for(const g of played){
    if(g.week!==wk) continue;
    const w=winnerOf(g); if(!w) continue;
    if(ownerAt(w,g.date)===o) n++;
  }
  return n;
}
/* money won: $1 per H2H win */
function moneyByOwner(){
  const m={}; D.owners.forEach(o=>m[o]=0);
  for(const g of played){
    if(!h2h(g)) continue;
    const w=winnerOf(g); if(!w) continue;
    const o=ownerAt(w,g.date);
    if(o) m[o]+=1;
  }
  return m;
}
function teamRecord(t){
  let w=0,l=0;
  for(const g of played){
    if(g.home!==t && g.away!==t) continue;
    const win=winnerOf(g);
    if(!win){continue}
    if(win===t) w++; else l++;
  }
  return w+'-'+l;
}
/* standings with tiebreak: pts, then reverse draft slot (later pick wins) */
function standings(){
  const p=pointsByOwner();
  return D.owners.slice().sort((a,b)=>
    (p[b]-p[a]) || ((D.draftSlot[b]||0)-(D.draftSlot[a]||0))
  ).map((o,i)=>({o,pts:p[o],rank:i+1}));
}
/* waiver order is its own ranking, not a reversal of standings: fewest points
   picks first, and on a tie the LATER draft slot also picks first (same fact
   that wins the standings tiebreak wins the waiver tiebreak too) */
function waiverOrder(){
  const p=pointsByOwner();
  return D.owners.slice().sort((a,b)=>
    (p[a]-p[b]) || ((D.draftSlot[b]||0)-(D.draftSlot[a]||0))
  ).map((o,i)=>({o,pts:p[o],rank:i+1}));
}
/* transactions derived from ledger */
function moves(){
  return D.stints
    .filter(s=>s.via && s.via!=='Draft')
    .sort((a,b)=> (b.start||'').localeCompare(a.start||''))
    .map(s=>{
      // who lost it? the stint on same team ending just before
      const prev = D.stints.find(x=>x.team===s.team && x.end && x.end < s.start);
      return {team:s.team,to:s.owner,from:prev?prev.owner:null,date:s.start,via:s.via};
    });
}

function chip(t,{rec=false}={}){
  const [p,a]=col(t);
  return `<span class="chip" style="background:#${p};color:#${a}">${esc(t)}${rec?`<span class="rec">${teamRecord(t)}</span>`:''}</span>`;
}

/* ============ views ============ */
const V = {};

V.standings = ()=>{
  const s=standings(), max=Math.max(1,...s.map(x=>x.pts));
  const body = s.map(r=>`
    <tr class="${r.rank===1&&hasResults?'lead':''}">
      <td class="rank">${r.rank}</td>
      <td>
        <div class="who">${esc(r.o)}</div>
        <div class="bar"><i style="width:${hasResults?(r.pts/max*100):0}%"></i></div>
      </td>
      <td class="pts">${r.pts}</td>
    </tr>`).join('');
  return `
  <div class="phead"><h1>Standings</h1>
    <p>One point per regular-season win. Points stay with the owner who held the team that week.</p></div>
  <div class="card">
    <table>
      <thead><tr><th style="width:34px">#</th><th>Squad</th><th style="text-align:right">Pts</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
    ${hasResults?'':`<div class="empty" style="border-top:1px solid var(--line)">
      <div class="big">No games played yet</div>
      <p>Standings fill in automatically once results are posted. Ties break by draft slot — the later first-round pick wins.</p>
    </div>`}
  </div>`;
};

V.weeks = (wk)=>{
  const cur = wk ?? (hasResults ? Math.max(...played.map(g=>g.week)) : weeks[0]);
  const bar = weeks.map(w=>`<button class="${w===cur?'on':''}" onclick="go('weeks',${w})">Wk ${w}</button>`).join('');
  const blocks = D.owners.map(o=>{
    const roster=new Set(currentRoster(o));
    const gs = D.games.filter(g=>g.week===cur && (
      ownerAt(g.home,g.date)===o || ownerAt(g.away,g.date)===o));
    const pts = weeklyPoints(o,cur);
    const rows = gs.length? gs.map(g=>{
      const mine = ownerAt(g.home,g.date)===o ? g.home : g.away;
      const opp  = mine===g.home ? g.away : g.home;
      const win=winnerOf(g);
      const st = win==null ? 'p' : (win===mine?'w':'l');
      const mark = win==null ? '–' : (win===mine?'W':'L');
      const sc = (g.homePts!=null)? `${g.homePts}–${g.awayPts}` : '';
      const isH = h2h(g);
      const oppOwner = ownerAt(opp,g.date);
      return `<div class="g">
        <div class="res ${st}">${mark}</div>
        <div class="mt">${chip(mine)}
          <div class="vs">vs ${esc(opp)}${isH&&oppOwner?` <span class="badge">$1 vs ${esc(oppOwner)}</span>`:''}</div>
        </div>
        <div class="sc">${sc}</div>
        <div class="pt">${win===mine?'+1':''}</div>
      </div>`;
    }).join('') : `<div class="empty"><p>No games this week.</p></div>`;
    return `<div class="ownerblock">
      <div class="oh"><div class="nm">${esc(o)}</div><div class="wk">Week ${cur} &nbsp;<b>+${pts}</b></div></div>
      <div class="games">${rows}</div>
    </div>`;
  }).join('');
  return `
  <div class="phead"><h1>Week ${cur}</h1>
    <p>Every game your teams play, and exactly where each point came from.</p></div>
  <div class="weekbar">${bar}</div>
  ${blocks}`;
};

V.rosters = ()=>{
  const p=pointsByOwner();
  const cards = D.owners.map(o=>{
    const teams=currentRoster(o);
    const tiles = teams.map(t=>{
      const [pc,ac]=col(t);
      const cf=(D.teams[t]&&D.teams[t].conf)||'';
      return `<div class="tile" style="background:#${pc};color:#${ac}">
        <span>${esc(t)}</span>
        <span style="display:flex;gap:9px;align-items:center">
          <span class="cf">${esc(cf)}</span>
          <span class="rec">${teamRecord(t)}</span>
        </span>
      </div>`;
    }).join('');
    return `<div class="card squad">
      <div class="card-h"><h2>${esc(o)}</h2><div class="tot">${p[o]} pt${p[o]===1?'':'s'}</div></div>
      <div class="tiles">${tiles}</div>
    </div>`;
  }).join('');
  return `<div class="phead"><h1>Squads</h1>
    <p>Eight teams each. Records update as results are posted.</p></div>
    <div class="squads">${cards}</div>`;
};

V.money = ()=>{
  const m=moneyByOwner();
  const total=Object.values(m).reduce((a,b)=>a+b,0);
  const left=D.escrow-total;
  const board = D.owners.slice().sort((a,b)=>m[b]-m[a]).map((o,i)=>`
    <tr class="${i===0&&total>0?'lead':''}">
      <td class="rank">${i+1}</td>
      <td class="who">${esc(o)}</td>
      <td class="pts">${money(m[o])}</td>
    </tr>`).join('');

  /* cumulative chart */
  const series = D.owners.map(o=>{
    let run=0;
    return {o, pts: weeks.map(w=>{
      for(const g of played){
        if(g.week!==w) continue;
        if(!h2h(g)) continue;
        const win=winnerOf(g); if(!win) continue;
        if(ownerAt(win,g.date)===o) run++;
      }
      return run;
    })};
  });
  const maxY=Math.max(1,...series.flatMap(s=>s.pts));
  const W=560,H=180,PX=26,PY=12;
  const x=i=>PX+ i*(W-PX-8)/Math.max(1,weeks.length-1);
  const y=v=>H-PY- v*(H-PY*2)/maxY;
  const palette=['#1B2A41','#C8A24A','#1B7F4B','#B3261E','#5B3C8A','#1B4E8A'];
  const lines = series.map((s,i)=>{
    const d=s.pts.map((v,j)=>`${j?'L':'M'}${x(j).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${palette[i]}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join('');
  const grid=[0,.5,1].map(f=>{
    const v=Math.round(maxY*f);
    return `<line x1="${PX}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EAEF" stroke-width="1"/>
            <text x="0" y="${y(v)+4}" font-size="10" fill="#8A939C" font-family="Roboto Mono,monospace">$${v}</text>`;
  }).join('');
  const legend = series.map((s,i)=>`<span><i style="background:${palette[i]}"></i>${esc(s.o)}</span>`).join('');

  const items = played.filter(g=>h2h(g)&&winnerOf(g)).sort((a,b)=>b.date.localeCompare(a.date)).map(g=>{
    const w=winnerOf(g), o=ownerAt(w,g.date);
    const loser = w===g.home?g.away:g.home;
    const lo = ownerAt(loser,g.date);
    return `<div class="move">
      <div class="d">Wk ${g.week}</div>
      <div class="b"><div style="font-weight:600">${esc(o)} <span style="color:var(--muted);font-weight:400">beat</span> ${esc(lo)}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:3px">${chip(w)} def. ${esc(loser)} ${g.homePts}–${g.awayPts}</div></div>
      <div style="font-family:'Barlow Condensed';font-weight:700;font-size:19px;color:var(--gold)">+$1</div>
    </div>`;
  }).join('');

  return `<div class="phead"><h1>Money</h1>
    <p>A dollar rides on every regular-season game between two squads. Paid from the ${money(D.escrow)} escrow.</p></div>
  <div class="moneygrid">
    <div class="mstat"><div class="k">Paid out</div><div class="v">${money(total)}</div></div>
    <div class="mstat"><div class="k">Escrow left</div><div class="v gold">${money(left)}</div></div>
    <div class="mstat"><div class="k">Prize pool</div><div class="v">${money(D.prizePool)}</div></div>
  </div>
  <div class="card">
    <div class="card-h"><h2>Won this season</h2></div>
    <table><tbody>${board}</tbody></table>
  </div>
  <div class="card">
    <div class="card-h"><h2>Running total</h2><span class="hint">cumulative $ by week</span></div>
    <div class="chart"><div class="chartwrap">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Cumulative money won by week">
        ${grid}${lines}
      </svg>
    </div></div>
    <div class="legend">${legend}</div>
  </div>
  <div class="card">
    <div class="card-h"><h2>Every dollar</h2><span class="hint">${played.filter(g=>h2h(g)&&winnerOf(g)).length} paid</span></div>
    ${items || `<div class="empty"><div class="big">Nothing paid yet</div>
      <p>Head-to-head wins show up here one line at a time, newest first.</p></div>`}
  </div>`;
};

V.waivers = (conf)=>{
  const avail = Object.keys(D.teams).filter(t=>!rostered.has(t)).sort();
  const confs = [...new Set(avail.map(t=>D.teams[t].conf))].sort();
  const active = conf || 'All';
  const list = active==='All' ? avail : avail.filter(t=>D.teams[t].conf===active);
  const btns = ['All',...confs].map(c=>
    `<button class="${c===active?'on':''}" onclick="go('waivers','${esc(c)}')">${esc(c)}</button>`).join('');
  const grid = list.map(t=>chip(t,{rec:hasResults})).join('');

  const s=waiverOrder();
  const prio = s.map((r,i)=>`<div class="prow ${i===0?'first':''}">
      <div class="n">${i+1}</div><div class="nm">${esc(r.o)}</div>
      <div class="pp">${r.pts} pts</div></div>`).join('');

  return `<div class="phead"><h1>Waiver wire</h1>
    <p>${avail.length} teams unclaimed. Priority runs in reverse standings order and resets every week.</p></div>
  <div class="card">
    <div class="card-h"><h2>Priority this week</h2><span class="hint">fewest points picks first</span></div>
    <div class="prio">${prio}</div>
  </div>
  <div class="card">
    <div class="card-h"><h2>Available</h2><span class="hint">${list.length} shown</span></div>
    <div class="filters">${btns}</div>
    <div class="wgrid">${grid}</div>
  </div>`;
};

V.moves = ()=>{
  const ms=moves();
  const rows = ms.map(m=>`
    <div class="move">
      <div class="d">${esc(m.date||'')}</div>
      <div class="b">
        <span class="kind ${m.via.toLowerCase()==='trade'?'trade':m.via.toLowerCase()==='waiver'?'waiver':'fa'}">${esc(m.via)}</span>
        <div>${chip(m.team)}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:5px">
          ${m.from?`${esc(m.from)} <span style="opacity:.6">&rarr;</span> `:'Claimed by '}<b style="color:var(--ink)">${esc(m.to)}</b>
        </div>
      </div>
    </div>`).join('');
  return `<div class="phead"><h1>Moves</h1>
    <p>Every trade, waiver claim, and free-agent pickup, newest first.</p></div>
  <div class="card">
    <div class="card-h"><h2>Transaction log</h2><span class="hint">${ms.length} move${ms.length===1?'':'s'}</span></div>
    ${rows || `<div class="empty"><div class="big">No moves yet</div>
      <p>Rosters are as drafted. Trades and claims appear here the moment they're recorded in the ledger.</p></div>`}
  </div>`;
};

/* ============ router ============ */
const TABS=[
  ['standings','Standings','M3 13h2v7H3v-7zm4-5h2v12H7V8zm4-5h2v17h-2V3zm4 8h2v9h-2v-9zm4-4h2v13h-2V7z'],
  ['weeks','Weekly points','M7 2v2H4v18h16V4h-3V2h-2v2H9V2H7zm11 8v10H6V10h12z'],
  ['rosters','Squads','M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z'],
  ['money','Money','M12 2v2.2c2.3.2 4 1.5 4 3.3h-2.2c0-.8-.9-1.4-1.8-1.5v3.3c2.6.5 4 1.6 4 3.6 0 2-1.7 3.4-4 3.6V20h-1.5v-2.5c-2.5-.2-4.3-1.6-4.3-3.6h2.2c0 .9 1 1.6 2.1 1.7v-3.5C7.9 11.6 6.6 10.5 6.6 8.6c0-1.9 1.7-3.2 3.9-3.4V2H12z'],
  ['waivers','Waiver wire','M3 5h18v2H3V5zm0 6h12v2H3v-2zm0 6h18v2H3v-2z'],
  ['moves','Moves','M7 7h10l-3-3 1.4-1.4L21 8l-5.6 5.4L14 12l3-3H7V7zm10 10H7l3 3-1.4 1.4L3 16l5.6-5.4L10 12l-3 3h10v2z'],
];
let state={tab:'standings',arg:null};

function renderNav(){
  $('#nav').innerHTML = TABS.map(([k,label,d])=>
    `<button class="${state.tab===k?'on':''}" onclick="go('${k}')">
      <svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>
      ${label}
    </button>`).join('');
  const played_n = played.length;
  $('#foot').innerHTML = `${D.owners.length} squads &middot; ${rostered.size} teams<br>`+
    (played_n? `${played_n} games played` : `Season opens Sept 5`) +
    `<br><span style="opacity:.7">Updated ${D.generated}</span>`;
}
function go(tab,arg){
  state={tab,arg:arg??null};
  document.body.classList.remove('menu');
  renderNav();
  $('#view').innerHTML = V[tab](arg);
  window.scrollTo({top:0,behavior:'instant'});
}
renderNav();
go('standings');
</script>
</body>
</html>
